<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job Scheduler</title>
  <link rel="stylesheet" href="/dashboard/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="logo"><span class="logo-mark" data-icon="workflow"></span><span class="logo-text">Job Scheduler</span></div>
        <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close menu" data-icon="x"></button>
      </div>
      <nav class="nav" id="nav">
        <a href="#/overview" class="nav-item" data-route="overview"><span class="nav-icon" data-icon="layout-dashboard"></span>Overview</a>
        <a href="#/queues" class="nav-item" data-route="queues"><span class="nav-icon" data-icon="layers"></span>Queues</a>
        <a href="#/jobs" class="nav-item" data-route="jobs"><span class="nav-icon" data-icon="list-ordered"></span>Jobs</a>
        <a href="#/workers" class="nav-item" data-route="workers"><span class="nav-icon" data-icon="server"></span>Workers</a>
        <a href="#/dead-letter" class="nav-item" data-route="dead-letter"><span class="nav-icon" data-icon="archive"></span>Dead Letter</a>
        <a href="#/metrics" class="nav-item" data-route="metrics"><span class="nav-icon" data-icon="bar-chart-3"></span>Metrics</a>
      </nav>
      <div class="sidebar-foot">
        <div class="conn" id="connStatus">
          <span class="conn-dot"></span><span class="conn-text">Not connected</span>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="shell">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" data-icon="menu"></button>
        <div class="topbar-title" id="topbarTitle">Overview</div>
        <div class="topbar-actions">
          <div class="project-picker" id="projectPickerWrap" hidden>
            <span class="pp-label" data-icon="folder"></span>
            <select id="projectPicker" class="select"></select>
            <button class="icon-btn" id="newProjectBtn" title="New project" data-icon="plus"></button>
          </div>
          <div class="key-field">
            <input id="apiKey" type="password" placeholder="API key" autocomplete="off" spellcheck="false" />
          </div>
          <button class="btn btn-primary" id="connectBtn">Connect</button>
        </div>
      </header>

      <main class="content" id="content"></main>
    </div>
  </div>

  <div id="drawer-root"></div>
  <div id="dialog-root"></div>
  <div id="toast-root"></div>

  <script src="/dashboard/app.js"></script>
</body>
</html>
